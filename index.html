
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chai Ki Tapri — A little escape</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #f2e7d4;
  --muted: #a79a88;
  --accent: #d8a66a;
  --dark: #100e0b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--dark);
  color: var(--cream);
  font-family: 'DM Mono', monospace;
  overflow-x: hidden;
}

.background {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(180deg, rgba(12,10,8,.35), rgba(12,10,8,.78)),
    url('https://images.unsplash.com/photo-1571934811356-5cc061b6821f?auto=format&fit=crop&w=2000&q=85')
    center/cover;
  filter: brightness(.65) saturate(.7);
}

.background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 5%, #100e0b 100%);
}

.top {
  position: absolute;
  top: 30px;
  left: 30px;
  right: 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
}

.live {
  display: flex;
  align-items: center;
  gap: 9px;
}

.dot {
  width: 6px;
  height: 6px;
  background: #b6c79b;
  border-radius: 50%;
  box-shadow: 0 0 10px #b6c79b;
}

main {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 100px 20px 40px;
  text-align: center;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(42px, 8vw, 76px);
  font-weight: 500;
  letter-spacing: -2px;
  margin: 0 0 10px;
  text-shadow: 0 4px 30px #000;
}

.subtitle {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 35px;
}

.player {
  width: min(390px, 94vw);
  padding: 25px;
  border: 1px solid #ffffff20;
  border-radius: 4px;
  background: rgba(20,17,13,.86);
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 80px #0008;
}

.player-top {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 2px;
  margin-bottom: 25px;
}

.album {
  width: 110px;
  height: 110px;
  margin: auto;
  border: 1px solid #ffffff30;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle, #d8a66a 0 4%, #5c3c25 5% 20%, #1d1915 21% 100%);
  box-shadow: 0 0 40px #d8a66a18;
}

.album::after {
  content: "";
  width: 13px;
  height: 13px;
  background: var(--cream);
  border-radius: 50%;
}

.album.playing {
  animation: spin 8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.youtube-container {
  display: none;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 4px;
  background: #000;
  margin: 0 auto 18px;
}

#youtubePlayer,
#youtubePlayer iframe {
  width: 100%;
  height: 100%;
}

.track {
  margin: 25px 0 8px;
  font-family: 'Playfair Display', serif;
  font-size: 19px;
  overflow-wrap: anywhere;
}

.artist {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
}

.status {
  font-size: 9px;
  color: var(--muted);
  margin-top: 12px;
  min-height: 25px;
  overflow-wrap: anywhere;
}

.progress {
  margin: 24px 0 8px;
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}

.times {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--muted);
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 17px;
  margin: 22px 0;
}

button {
  border: 0;
  background: none;
  color: var(--cream);
  cursor: pointer;
  font: inherit;
}

.play {
  width: 52px;
  height: 52px;
  border: 1px solid #d8a66a80;
  border-radius: 50%;
  color: var(--accent);
  font-size: 18px;
  flex-shrink: 0;
}

.play:hover {
  background: var(--accent);
  color: var(--dark);
}

.small {
  color: var(--muted);
  font-size: 15px;
  padding: 7px;
}

.small.active {
  color: var(--accent);
}

.upload {
  display: block;
  margin: 14px auto 0;
  color: var(--muted);
  font-size: 10px;
  cursor: pointer;
}

.upload:hover {
  color: var(--cream);
}

.url-form {
  display: flex;
  gap: 6px;
  margin-top: 15px;
}

.url-form input {
  width: 100%;
  min-width: 0;
  background: #ffffff08;
  border: 1px solid #ffffff20;
  padding: 10px;
  color: var(--cream);
  outline: none;
  font: 10px 'DM Mono', monospace;
}

.url-form button {
  border: 1px solid #ffffff30;
  padding: 0 14px;
  font-size: 10px;
  color: var(--accent);
}

.playlist-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 27px;
  padding-bottom: 10px;
  border-bottom: 1px solid #ffffff20;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
}

.playlist-heading button {
  color: var(--accent);
  font-size: 10px;
}

.playlist {
  margin-top: 8px;
  max-height: 190px;
  overflow-y: auto;
  text-align: left;
}

.playlist-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 7px;
  border-bottom: 1px solid #ffffff0c;
  cursor: pointer;
}

.playlist-item:hover {
  background: #ffffff09;
}

.playlist-item.active {
  background: #d8a66a13;
}

.song-number {
  color: var(--muted);
  font-size: 10px;
  min-width: 18px;
}

.song-details {
  min-width: 0;
  flex: 1;
}

.song-title {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.song-type {
  color: var(--muted);
  font-size: 8px;
  margin-top: 4px;
}

.song-playing {
  color: var(--accent);
  font-size: 12px;
}

.remove-song {
  color: var(--muted);
  font-size: 17px;
  padding: 5px;
}

.empty-playlist {
  color: var(--muted);
  font-size: 10px;
  padding: 18px 5px;
  text-align: center;
}

.footer {
  padding: 20px 0 25px;
  width: 100%;
  text-align: center;
  color: #b9aa96;
  font-size: 9px;
  letter-spacing: 2px;
}

@media(max-width: 600px) {
  .top {
    top: 20px;
    left: 15px;
    right: 15px;
    font-size: 8px;
    letter-spacing: 1px;
  }

  main { padding-top: 85px; }

  .subtitle {
    font-size: 9px;
    margin-bottom: 25px;
  }

  .player { padding: 20px; }
}

@media(max-height: 700px) {
  main { padding-top: 70px; padding-bottom: 30px; }
  .subtitle { margin-bottom: 18px; }
  .player { padding: 17px; }
  .album { width: 80px; height: 80px; }
  .track { margin-top: 15px; }
  .progress { margin-top: 15px; }
  .controls { margin: 14px 0; }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="top">
  <span>EST. AFTER HOURS</span>
  <div class="live">
    <span class="dot"></span>
    <span id="listeners">142 people chilling here right now</span>
  </div>
</div>

<main>
  <h1>Chai Ki Tapri</h1>
  <div class="subtitle">A little escape from everything</div>

  <section class="player">

    <div class="player-top">
      <span>NOW PLAYING</span>
      <span>TAPRI FM</span>
    </div>

    <div class="album" id="album"></div>

    <div class="youtube-container" id="youtubeContainer">
      <div id="youtubePlayer"></div>
    </div>

    <div class="track" id="track">Midnight Chai</div>
    <div class="artist" id="artist">SOMEWHERE IN INDIA</div>
    <div class="status" id="status">Ready for a chai break.</div>

    <audio id="audio" preload="metadata"></audio>

    <input class="progress" id="progress"
      type="range" min="0" max="100" value="0">

    <div class="times">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button class="small active" id="loop" title="Loop">↻</button>
      <button class="small" id="previous" title="Previous">|◀</button>
      <button class="play" id="play" title="Play/Pause">▶</button>
      <button class="small" id="next" title="Next">▶|</button>
      <button class="small" id="mute" title="Mute">♪</button>
    </div>

    <label class="upload">
      + ADD YOUR OWN AUDIO
      <input id="file" type="file" accept="audio/*" hidden>
    </label>

    <form class="url-form" id="urlForm">
      <input id="url" type="url"
        placeholder="Paste YouTube or audio URL" required>
      <button type="submit">ADD</button>
    </form>

    <div class="playlist-heading">
      <span>YOUR PLAYLIST</span>
      <button type="button" id="clearPlaylist">CLEAR ALL</button>
    </div>

    <div class="playlist" id="playlist">
      <div class="empty-playlist">Your playlist is waiting for music ☕</div>
    </div>

  </section>
</main>

<div class="footer">
  CHAI OVER EVERYTHING · TAKE YOUR TIME
</div>

<script>
'use strict';

const audio = document.getElementById('audio');
const playButton = document.getElementById('play');
const album = document.getElementById('album');
const progress = document.getElementById('progress');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const statusText = document.getElementById('status');
const youtubeContainer = document.getElementById('youtubeContainer');
const playlistElement = document.getElementById('playlist');

const STORAGE_KEY = 'chaiKiTapriPlaylist_v3';

let playlist = [];
let currentIndex = -1;

let youtubePlayer = null;
let youtubeReady = false;
let apiReady = false;

let currentSource = 'audio';
let muted = false;
let looping = true;
let audioObjectURL = null;

let savedPosition = 0;
let restoring = false;

function setStatus(message) {
  statusText.textContent = message;
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return '0:00';

  return Math.floor(seconds / 60) + ':' +
    String(Math.floor(seconds % 60)).padStart(2, '0');
}

function setPlaying(playing) {
  playButton.textContent = playing ? 'Ⅱ' : '▶';
  album.classList.toggle(
    'playing',
    playing && currentSource === 'audio'
  );
}

function resetProgress() {
  progress.value = 0;
  current.textContent = '0:00';
  duration.textContent = '0:00';
}

function getCurrentSong() {
  return playlist[currentIndex] || null;
}

function generateId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

function getYouTubeId(url) {
  try {
    const parsed = new URL(url);
    const host = parsed.hostname.replace(/^www\./, '');
    let id = null;

    if (host === 'youtu.be') {
      id = parsed.pathname.split('/')[1];
    }

    if (
      host === 'youtube.com' ||
      host === 'm.youtube.com' ||
      host === 'youtube-nocookie.com'
    ) {
      if (parsed.pathname === '/watch') {
        id = parsed.searchParams.get('v');
      } else {
        const match = parsed.pathname.match(
          /^\/(?:embed|shorts|live)\/([^/]+)/
        );
        if (match) id = match[1];
      }
    }

    return id && /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
  } catch (error) {
    return null;
  }
}

function getCurrentPosition() {
  if (currentSource === 'youtube' &&
      youtubePlayer && youtubeReady) {
    return youtubePlayer.getCurrentTime() || 0;
  }

  if (currentSource === 'audio') {
    return audio.currentTime || 0;
  }

  return 0;
}

function savePlaylist() {
  try {
    const savedSongs = playlist
      .filter(song => !song.local)
      .map(song => ({
        id: song.id,
        type: song.type,
        url: song.url,
        videoId: song.videoId || null,
        title: song.title,
        artist: song.artist
      }));

    const activeSong = getCurrentSong();

    const data = {
      playlist: savedSongs,
      currentId: activeSong && !activeSong.local
        ? activeSong.id
        : null,
      position: activeSong && !activeSong.local
        ? getCurrentPosition()
        : 0,
      looping,
      muted
    };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (error) {
    console.error('Storage error:', error);
  }
}

function loadSavedPlaylist() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;

    const data = JSON.parse(saved);

    if (Array.isArray(data.playlist)) {
      playlist = data.playlist.filter(song =>
        song &&
        typeof song.id === 'string' &&
        typeof song.url === 'string' &&
        (song.type === 'youtube' || song.type === 'audio')
      );
    }

    looping = data.looping !== false;
    muted = data.muted === true;

    savedPosition = Number.isFinite(data.position)
      ? Math.max(0, data.position)
      : 0;

    audio.loop = looping;
    audio.muted = muted;

    document.getElementById('loop').classList.toggle('active', looping);
    document.getElementById('mute').classList.toggle('active', muted);

    if (data.currentId) {
      currentIndex = playlist.findIndex(
        song => song.id === data.currentId
      );
    }
  } catch (error) {
    console.error('Restore error:', error);
  }
}

function renderPlaylist() {
  playlistElement.innerHTML = '';

  if (!playlist.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-playlist';
    empty.textContent = 'Your playlist is waiting for music ☕';
    playlistElement.appendChild(empty);
    return;
  }

  playlist.forEach((song, index) => {
    const item = document.createElement('div');
    item.className = 'playlist-item';

    if (index === currentIndex) item.classList.add('active');

    const number = document.createElement('span');
    number.className = 'song-number';
    number.textContent = String(index + 1).padStart(2, '0');

    const details = document.createElement('div');
    details.className = 'song-details';

    const title = document.createElement('div');
    title.className = 'song-title';
    title.textContent = song.title;

    const type = document.createElement('div');
    type.className = 'song-type';
    type.textContent = song.local
      ? 'LOCAL AUDIO'
      : song.type === 'youtube' ? 'YOUTUBE' : 'AUDIO URL';

    details.appendChild(title);
    details.appendChild(type);

    const indicator = document.createElement('span');
    indicator.className = 'song-playing';
    indicator.textContent = index === currentIndex ? '♫' : '';

    const remove = document.createElement('button');
    remove.className = 'remove-song';
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = 'Remove song';

    remove.addEventListener('click', event => {
      event.stopPropagation();
      removeSong(index);
    });

    item.append(number, details, indicator, remove);

    item.addEventListener('click', () => playSong(index, true));

    playlistElement.appendChild(item);
  });
}

function stopAudio() {
  audio.pause();
  audio.removeAttribute('src');
  audio.load();
}

function destroyYouTube() {
  if (youtubePlayer) {
    try {
      youtubePlayer.destroy();
    } catch (error) {
      console.error(error);
    }
  }

  youtubePlayer = null;
  youtubeReady = false;

  document.getElementById('youtubePlayer').innerHTML = '';
  youtubeContainer.style.display = 'none';
}

function playSong(index, autoplay = true, resumeAt = 0) {
  if (index < 0 || index >= playlist.length) return;

  const song = playlist[index];

  stopAudio();
  destroyYouTube();

  currentIndex = index;
  currentSource = song.type;
  savedPosition = resumeAt;

  resetProgress();
  setPlaying(false);
  renderPlaylist();

  document.getElementById('track').textContent = song.title;
  document.getElementById('artist').textContent = song.artist || 'TAPRI FM';

  if (song.type === 'youtube') {
    album.style.display = 'none';
    youtubeContainer.style.display = 'block';

    setStatus('Connecting to YouTube...');

    if (apiReady) {
      createYouTubePlayer(song.videoId, autoplay, resumeAt);
    }
  } else {
    currentSource = 'audio';
    album.style.display = 'grid';

    audio.src = song.url;
    audio.loop = looping;
    audio.muted = muted;

    const onMetadata = function() {
      audio.removeEventListener('loadedmetadata', onMetadata);

      if (currentIndex !== index) return;

      duration.textContent = formatTime(audio.duration);

      if (resumeAt > 0 && resumeAt < audio.duration) {
        audio.currentTime = resumeAt;
      }

      if (autoplay) {
        audio.play().catch(error => {
          setStatus('Song ready. Press play to listen.');
          console.error(error);
        });
      } else {
        setStatus('Last song restored. Press play to resume.');
      }

      savedPosition = 0;
    };

    audio.addEventListener('loadedmetadata', onMetadata);
    setStatus('Loading audio...');
  }

  savePlaylist();
}

function createYouTubePlayer(videoId, autoplay, resumeAt = 0) {
  const song = getCurrentSong();

  if (!apiReady || !song || song.videoId !== videoId ||
      currentSource !== 'youtube') return;

  youtubeReady = false;

  youtubePlayer = new YT.Player('youtubePlayer', {
    width: '100%',
    height: '100%',
    videoId,

    playerVars: {
      autoplay: autoplay ? 1 : 0,
      controls: 1,
      playsinline: 1,
      rel: 0,
      origin: window.location.origin
    },

    events: {
      onReady: function(event) {
        if (getCurrentSong() !== song) return;

        youtubeReady = true;

        if (muted) event.target.mute();
        else event.target.unMute();

        if (resumeAt > 0) {
          event.target.seekTo(resumeAt, true);
        }

        if (autoplay) {
          event.target.playVideo();
        } else {
          setStatus('Last song restored. Press play to resume.');
        }

        savedPosition = 0;
      },

      onStateChange: function(event) {
        if (getCurrentSong() !== song) return;

        if (event.data === YT.PlayerState.PLAYING) {
          setPlaying(true);
          setStatus('Now playing · Tapri FM');
        } else if (event.data === YT.PlayerState.PAUSED) {
          setPlaying(false);
          savePlaylist();
          setStatus('Music paused.');
        } else if (event.data === YT.PlayerState.ENDED) {
          setPlaying(false);

          if (looping) {
            event.target.seekTo(0, true);
            event.target.playVideo();
          } else {
            playNext();
          }
        } else if (event.data === YT.PlayerState.BUFFERING) {
          setStatus('Buffering...');
        }
      },

      onError: function(event) {
        if (getCurrentSong() !== song) return;

        setPlaying(false);

        const errors = {
          2: 'Invalid YouTube video ID.',
          5: 'HTML5 player error.',
          100: 'Video unavailable.',
          101: 'Video owner does not allow embedding.',
          150: 'Video owner does not allow embedding.',
          153: 'YouTube requires a valid website origin.'
        };

        setStatus(errors[event.data] || 'YouTube playback error: ' + event.data);
      }
    }
  });
}

window.onYouTubeIframeAPIReady = function() {
  apiReady = true;

  const song = getCurrentSong();

  if (song && song.type === 'youtube' && currentSource === 'youtube') {
    createYouTubePlayer(song.videoId, false, savedPosition);
  }
};

const youtubeScript = document.createElement('script');
youtubeScript.src = 'https://www.youtube.com/iframe_api';
youtubeScript.async = true;
youtubeScript.onerror = () => setStatus('Could not connect to YouTube.');
document.head.appendChild(youtubeScript);

function addSong(song) {
  playlist.push(song);
  renderPlaylist();
  savePlaylist();

  setStatus('Added: ' + song.title);

  if (playlist.length === 1) {
    playSong(0, true);
  }
}

function playNext() {
  if (!playlist.length) return;

  if (currentIndex < playlist.length - 1) {
    playSong(currentIndex + 1, true);
  } else if (looping) {
    playSong(0, true);
  } else {
    setPlaying(false);
    setStatus('Playlist finished. Enjoy your chai ☕');
  }
}

function playPrevious() {
  if (!playlist.length) return;

  if (getCurrentPosition() > 3) {
    if (currentSource === 'youtube' && youtubeReady) {
      youtubePlayer.seekTo(0, true);
    } else if (currentSource === 'audio') {
      audio.currentTime = 0;
    }
    return;
  }

  if (currentIndex > 0) {
    playSong(currentIndex - 1, true);
  } else if (looping) {
    playSong(playlist.length - 1, true);
  }
}

function removeSong(index) {
  if (index < 0 || index >= playlist.length) return;

  const wasCurrent = index === currentIndex;
  const removed = playlist[index];

  if (wasCurrent) {
    stopAudio();
    destroyYouTube();
    setPlaying(false);
  }

  if (removed.objectURL) {
    URL.revokeObjectURL(removed.objectURL);
  }

  playlist.splice(index, 1);

  if (!playlist.length) {
    currentIndex = -1;
    currentSource = 'audio';
    album.style.display = 'grid';

    document.getElementById('track').textContent = 'Midnight Chai';
    document.getElementById('artist').textContent = 'SOMEWHERE IN INDIA';

    resetProgress();
    setStatus('Your playlist is empty.');
  } else if (wasCurrent) {
    currentIndex = -1;
    playSong(Math.min(index, playlist.length - 1), false);
  } else {
    if (index < currentIndex) currentIndex--;
  }

  renderPlaylist();
  savePlaylist();
}

// Play and pause
playButton.addEventListener('click', function() {
  if (!getCurrentSong()) {
    if (playlist.length) playSong(0, true);
    else setStatus('Add a song to your playlist first.');
    return;
  }

  if (currentSource === 'youtube') {
    if (!youtubePlayer || !youtubeReady) {
      setStatus('Please wait for YouTube to load.');
      return;
    }

    if (youtubePlayer.getPlayerState() === YT.PlayerState.PLAYING) {
      youtubePlayer.pauseVideo();
    } else {
      youtubePlayer.playVideo();
    }
    return;
  }

  if (audio.paused) {
    audio.play().catch(error => {
      setStatus('Playback failed: ' + error.message);
    });
  } else {
    audio.pause();
  }
});

// Audio events
audio.addEventListener('play', function() {
  setPlaying(true);
  setStatus('Now playing · Your music');
});

audio.addEventListener('pause', function() {
  setPlaying(false);
  savePlaylist();
});

audio.addEventListener('loadedmetadata', function() {
  if (currentSource === 'audio') {
    duration.textContent = formatTime(audio.duration);
  }
});

audio.addEventListener('timeupdate', function() {
  if (currentSource !== 'audio' || !audio.duration) return;

  progress.value = audio.currentTime / audio.duration * 100;
  current.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('ended', function() {
  if (!looping) playNext();
});

audio.addEventListener('error', function() {
  if (audio.src) setStatus('Audio loading failed. Check the file or URL.');
});

// Progress
progress.addEventListener('input', function() {
  if (currentSource === 'audio' && audio.duration) {
    audio.currentTime = progress.value / 100 * audio.duration;
  } else if (currentSource === 'youtube' && youtubeReady) {
    const total = youtubePlayer.getDuration();
    if (total) {
      youtubePlayer.seekTo(progress.value / 100 * total, true);
    }
  }
});

// YouTube progress
setInterval(function() {
  if (currentSource !== 'youtube' || !youtubePlayer || !youtubeReady) return;

  const total = youtubePlayer.getDuration();
  const time = youtubePlayer.getCurrentTime();

  if (total > 0) {
    progress.value = time / total * 100;
    current.textContent = formatTime(time);
    duration.textContent = formatTime(total);
  }
}, 500);

// Loop
document.getElementById('loop').addEventListener('click', function() {
  looping = !looping;
  audio.loop = looping;

  this.classList.toggle('active', looping);
  setStatus(looping ? 'Loop enabled.' : 'Loop disabled.');
  savePlaylist();
});

// Mute
document.getElementById('mute').addEventListener('click', function() {
  muted = !muted;
  audio.muted = muted;

  if (youtubePlayer && youtubeReady) {
    if (muted) youtubePlayer.mute();
    else youtubePlayer.unMute();
  }

  this.classList.toggle('active', muted);
  savePlaylist();
});

// Previous and next
document.getElementById('previous').addEventListener('click', playPrevious);
document.getElementById('next').addEventListener('click', playNext);

// Local audio upload
document.getElementById('file').addEventListener('change', function(event) {
  const file = event.target.files[0];
  if (!file) return;

  const objectURL = URL.createObjectURL(file);

  addSong({
    id: generateId(),
    type: 'audio',
    url: objectURL,
    title: file.name,
    artist: 'YOUR MUSIC',
    local: true,
    objectURL
  });

  event.target.value = '';
});

// Add online URL
document.getElementById('urlForm').addEventListener('submit', function(event) {
  event.preventDefault();

  const input = document.getElementById('url');
  const url = input.value.trim();

  if (!url) return;

  const youtubeId = getYouTubeId(url);

  if (youtubeId) {
    addSong({
      id: generateId(),
      type: 'youtube',
      url,
      videoId: youtubeId,
      title: 'YouTube - ' + youtubeId,
      artist: 'YOUTUBE · TAPRI FM',
      local: false
    });

    input.value = '';
    return;
  }

  try {
    const parsed = new URL(url);

    if (!['https:', 'http:'].includes(parsed.protocol)) {
      setStatus('Use a valid HTTP or HTTPS URL.');
      return;
    }

    if (/\.(mp3|wav|ogg|m4a|aac)$/i.test(parsed.pathname)) {
      const filename = parsed.pathname.split('/').pop();

      addSong({
        id: generateId(),
        type: 'audio',
        url,
        title: decodeURIComponent(filename || 'Online Audio'),
        artist: 'ONLINE AUDIO · TAPRI FM',
        local: false
      });

      input.value = '';
      return;
    }

    setStatus('Unsupported link. Use YouTube or a direct audio URL.');
  } catch (error) {
    setStatus('Invalid URL.');
  }
});

// Clear playlist
document.getElementById('clearPlaylist').addEventListener('click', function() {
  stopAudio();
  destroyYouTube();

  playlist.forEach(song => {
    if (song.objectURL) URL.revokeObjectURL(song.objectURL);
  });

  playlist = [];
  currentIndex = -1;
  currentSource = 'audio';
  savedPosition = 0;

  album.style.display = 'grid';

  document.getElementById('track').textContent = 'Midnight Chai';
  document.getElementById('artist').textContent = 'SOMEWHERE IN INDIA';

  resetProgress();
  setPlaying(false);
  renderPlaylist();
  savePlaylist();

  setStatus('Playlist cleared. Start fresh!');
});

// Save playback position every 3 seconds
setInterval(function() {
  if (getCurrentSong()) savePlaylist();
}, 3000);

// Restore saved playlist
loadSavedPlaylist();
renderPlaylist();

if (currentIndex >= 0 && currentIndex < playlist.length) {
  playSong(currentIndex, false, savedPosition);
} else if (playlist.length) {
  currentIndex = -1;
  setStatus('Playlist restored. Choose a song.');
}

// Demo listener count
setInterval(function() {
  const count = document.getElementById('listeners');
  let value = parseInt(count.textContent, 10);

  value += Math.floor(Math.random() * 3) - 1;
  count.textContent = value + ' people chilling here right now';
}, 12000);

</script>
</body>
